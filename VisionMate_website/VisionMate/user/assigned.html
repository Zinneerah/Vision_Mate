<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assigned Patients – VisionMate User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../css/theme.css" rel="stylesheet" />
</head>
<body>
<div id="sidebarMount"></div>
<div class="main-wrapper">
  <div id="topbarMount"></div>
  <main class="content-area">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">Assigned Patients</h4>
        <p class="text-muted mb-0" id="subHeading">Your assigned patients — complete profiles</p>
      </div>
    </div>

    <div class="row g-4" id="personsList">
      <div class="col-12 text-muted small text-center py-4">Loading assigned patients…</div>
    </div>

    <!-- Patient Detail Modal -->
    <div class="modal fade" id="personModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header" style="background:var(--gradient-hero)">
            <h5 class="modal-title text-white fw-bold"><i class="bi bi-person-fill me-2"></i>Patient Profile</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer" id="modalFooter">
            <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Toast -->
<div class="toast-container">
  <div id="mainToast" class="toast-vm" style="display:none">
    <i class="bi bi-check-circle-fill text-success fs-5" id="toastIcon"></i>
    <span id="toastMsg">Saved.</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/firebase-auth.js"></script>
<script src="../js/user-layout.js"></script>
<script>
  const session = vmRequireUser();
  document.getElementById('sidebarMount').innerHTML = UserLayout.getSidebarHTML('Patients', session);
  document.getElementById('topbarMount').innerHTML  = UserLayout.getTopbarHTML('Assigned Patients', 'Complete profiles of all your assigned patients', session);

  let currentPersons = [];
  const list = document.getElementById('personsList');

  function patientName(p) { return p.patientName || p.name || '—'; }

  function render(persons) {
    currentPersons = persons;
    document.getElementById('subHeading').textContent =
      `Your ${persons.length} assigned patient${persons.length === 1 ? '' : 's'} — complete medical profiles`;

    if (!persons.length) {
      list.innerHTML = `<div class="col-12">
        <div class="section-card text-center py-5">
          <i class="bi bi-person-x fs-1 text-muted mb-2 d-block"></i>
          <div class="fw-medium">No patients assigned yet</div>
          <div class="text-muted small">Your administrator will assign patients to your account from the Admin Portal.</div>
        </div>
      </div>`;
      return;
    }

    list.innerHTML = persons.map((p, idx) => {
      const condList = (p.otherConditions || '').split(',').map(c => c.trim()).filter(Boolean);
      const isHw = !!p.hardwareLinked && session.hwLinked;
      const hwStyle = isHw ? 'border-color:#A5B4FC;box-shadow:0 0 0 3px rgba(91,63,232,0.08)' : '';
      const name = patientName(p);
      const medicalInfo = p.disease || p.medicalInfo || '—';
      return `
      <div class="col-md-6 col-xl-4">
        <div class="section-card h-100 mb-0" style="${hwStyle};cursor:pointer" onclick="showDetail('${p.firestoreId}')">
          <div class="card-body">
            <div class="d-flex align-items-start gap-3 mb-3">
              <div class="user-pill-avatar" style="width:50px;height:50px;font-size:1.1rem;flex-shrink:0;${isHw?'background:var(--gradient-btn)':''}">${getInitialU(name)}</div>
              <div class="flex-grow-1">
                <div class="fw-bold">
                  ${name}
                  ${isHw ? '<span class="badge ms-1 py-1 px-2" style="background:var(--gradient-btn);font-size:0.6rem"><i class="bi bi-cpu-fill"></i> LIVE</span>' : ''}
                </div>
                <div class="text-muted small">${p.gender||'—'} · Age ${p.age||'—'}</div>
                <div class="mt-1">${monBadgeU(p.monitoringStatus||'Active')}</div>
              </div>
              <span class="badge bg-light text-muted border">#${idx + 1}</span>
            </div>

            <div class="mb-2">
              <div class="form-section-divider">Primary Condition</div>
              <div class="small">${medicalInfo}</div>
            </div>

            ${condList.length ? `
            <div class="mb-2">
              <div class="form-section-divider">Other Conditions</div>
              <div>${condList.map(c => `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 me-1 mb-1">${c}</span>`).join('')}</div>
            </div>` : ''}

            <div class="mb-2">
              <div class="form-section-divider">Contact</div>
              <div class="small text-muted"><i class="bi bi-telephone me-1"></i>${p.contact||'—'}</div>
            </div>

            ${p.notes ? `<div class="alert alert-info py-2 px-3 mb-2 small"><i class="bi bi-info-circle me-1"></i>${p.notes.substring(0, 85)}${p.notes.length > 85 ? '…' : ''}</div>` : ''}

            <div class="d-flex gap-2 mt-3 flex-wrap">
              <button class="btn btn-sm btn-outline-primary rounded-pill flex-grow-1" onclick="event.stopPropagation();showDetail('${p.firestoreId}')">
                <i class="bi bi-eye me-1"></i>Full Profile
              </button>
              ${isHw ? `<a href="monitoring.html" class="btn btn-sm btn-primary-vm rounded-pill" onclick="event.stopPropagation()"><i class="bi bi-activity me-1"></i>Monitor</a>` : ''}
              <button class="btn btn-sm btn-warning rounded-pill fw-semibold" onclick="event.stopPropagation();quickEmergencyAlert('${p.firestoreId}', this)">
                <i class="bi bi-exclamation-triangle-fill"></i>
              </button>
              <button class="btn btn-sm btn-danger rounded-pill fw-semibold" onclick="event.stopPropagation();quickEmergencyCall('${p.firestoreId}', this)">
                <i class="bi bi-telephone-fill"></i>
              </button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  const bsModal = new bootstrap.Modal(document.getElementById('personModal'));

  function showDetail(pid) {
    const p = currentPersons.find(x => x.firestoreId === pid);
    if (!p) return;
    const condList = (p.otherConditions || '').split(',').map(c => c.trim()).filter(Boolean);
    const name = patientName(p);
    const isHw = !!p.hardwareLinked && session.hwLinked;
    const medicalInfo = p.disease || p.medicalInfo || '—';
    const relName = p.caregiverName || p.relativeName || '—';
    const relRel   = p.caregiverRelationship || p.relationship || 'Emergency Caregiver';
    const relContact = p.caregiverContact || p.emergencyContact || '—';
    const relType = p.relationship || 'Next of Kin';

    document.getElementById('modalBody').innerHTML = `
    <div class="row g-4">
      <div class="col-md-4 text-center">
        <div class="user-pill-avatar mx-auto mb-3" style="width:72px;height:72px;font-size:1.6rem;${isHw?'background:var(--gradient-btn)':''}">${getInitialU(name)}</div>
        <h5 class="fw-bold mb-1">${name}</h5>
        <div class="text-muted small mb-2">${p.gender||'—'} · Age ${p.age||'—'}</div>
        ${monBadgeU(p.monitoringStatus||'Active')}
        ${isHw ? '<div class="mt-2"><span class="badge py-2 px-3" style="background:var(--gradient-btn)"><i class="bi bi-cpu-fill me-1"></i>Hardware Monitoring</span></div>' : ''}
        <hr />
        <div class="text-start">
          <div class="small fw-semibold text-muted mb-1">PHONE</div>
          <div class="small mb-3"><i class="bi bi-telephone me-1 text-primary"></i>${p.contact||'—'}</div>
          <div class="small fw-semibold text-muted mb-1">ADDRESS</div>
          <div class="small mb-3"><i class="bi bi-geo-alt me-1 text-primary"></i>${p.address||'—'}</div>
          <div class="small fw-semibold text-muted mb-1">FAMILY CONTACT</div>
          <div class="small mb-1 fw-medium">${relName} <span class="badge bg-secondary ms-1">${relType}</span></div>
          <div class="small fw-semibold text-muted mb-1">EMERGENCY</div>
          <div class="small text-danger"><i class="bi bi-exclamation-circle me-1"></i>${relName} (${relRel}) — ${relContact}</div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="section-card mb-3">
          <div class="card-header"><i class="bi bi-file-medical-fill text-danger"></i> Medical Information</div>
          <div class="card-body">
            <p class="mb-3 fw-medium">${medicalInfo}</p>
            <div class="form-section-divider">Additional Conditions / Comorbidities</div>
            ${condList.length
              ? `<div class="d-flex flex-wrap gap-2 mb-2">${condList.map(c => `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-3 py-2">${c}</span>`).join('')}</div>`
              : '<div class="text-muted small">None</div>'
            }
            <div class="form-section-divider mt-3">Status Overview</div>
            <div class="row g-2 mt-1">
              <div class="col-6"><div class="step-card py-2"><div class="text-muted" style="font-size:.7rem">Health Status</div><div class="fw-medium small">${p.healthStatus||'Stable'}</div></div></div>
              <div class="col-6"><div class="step-card py-2"><div class="text-muted" style="font-size:.7rem">Emergency Status</div><div class="fw-medium small">${p.emergencyStatus||'None'}</div></div></div>
              <div class="col-6"><div class="step-card py-2"><div class="text-muted" style="font-size:.7rem">Hardware Status</div><div class="fw-medium small">${p.hardwareStatus||(p.hardwareLinked?'Connected':'N/A')}</div></div></div>
              <div class="col-6"><div class="step-card py-2"><div class="text-muted" style="font-size:.7rem">Assigned Caretaker</div><div class="fw-medium small">${p.assignedCaretakerName||session.name}</div></div></div>
            </div>
          </div>
        </div>
        <div class="section-card mb-0">
          <div class="card-header"><i class="bi bi-activity text-primary"></i> Care Notes & Clinical Observations</div>
          <div class="card-body">
            <p class="mb-0">${p.notes || 'No additional notes.'}</p>
            ${isHw ? `<div class="alert alert-primary mt-3 mb-0 py-2 px-3 small"><i class="bi bi-cpu-fill me-1"></i>This patient is connected to the VisionMate hardware device. <a href="monitoring.html" class="alert-link">Open live monitor →</a></div>` : ''}
          </div>
        </div>
      </div>
    </div>`;

    document.getElementById('modalFooter').innerHTML = `
      ${isHw ? `<a href="monitoring.html" class="btn btn-primary-vm btn-sm"><i class="bi bi-activity me-1"></i>Open Live Monitor</a>` : ''}
      <button class="btn btn-sm btn-warning fw-semibold" onclick="quickEmergencyAlert('${p.firestoreId}', this)"><i class="bi bi-exclamation-triangle-fill me-1"></i>Emergency Alert</button>
      <button class="btn btn-sm btn-danger fw-semibold" onclick="quickEmergencyCall('${p.firestoreId}', this)"><i class="bi bi-telephone-fill me-1"></i>Emergency Call</button>
      <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>`;

    bsModal.show();
  }
  window.showDetail = showDetail;

  // ── Per-patient Emergency Alert / Emergency Call ───────────────
  // For normal (non-hardware) caretakers, who don't have access to the
  // Monitoring page, this is where Emergency Alert/Call lives — scoped
  // to a specific assigned patient rather than a single "active patient"
  // guess. Same backend workflow as the hardware account's Monitoring
  // page: records the emergency event, dispatches to the patient's
  // saved Emergency Contact, and raises a real-time notification that
  // appears immediately in Notifications and on the Dashboard.
  function showListToast(msg, isError) {
    const t = document.getElementById('mainToast');
    if (!t) return;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').className = isError
      ? 'bi bi-exclamation-circle-fill text-danger fs-5'
      : 'bi bi-check-circle-fill text-success fs-5';
    t.style.display = 'flex';
    setTimeout(() => t.style.display = 'none', 4500);
  }

  async function quickEmergencyAlert(patientId, btn) {
    const patient = currentPersons.find(x => x.firestoreId === patientId);
    if (!patient) { showListToast('Patient record not found.', true); return; }
    const originalHtml = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    try {
      const result = await VmAuth.triggerEmergencyAlert(session.id, patient);
      showListToast(result.contactNumber
        ? `Emergency alert sent to ${result.contactName || 'emergency contact'} (${result.contactNumber}) for ${patientName(patient)}.`
        : `Emergency event recorded for ${patientName(patient)} — no emergency contact on file.`);
    } catch (e) {
      showListToast('Could not send alert: ' + e.message, true);
    } finally {
      setTimeout(() => { btn.disabled = false; btn.innerHTML = originalHtml; }, 1500);
    }
  }
  window.quickEmergencyAlert = quickEmergencyAlert;

  async function quickEmergencyCall(patientId, btn) {
    const patient = currentPersons.find(x => x.firestoreId === patientId);
    if (!patient) { showListToast('Patient record not found.', true); return; }
    const originalHtml = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    try {
      const result = await VmAuth.triggerEmergencyCall(session.id, patient);
      if (result.contactNumber) window.open('tel:' + result.contactNumber.replace(/[^0-9+]/g, ''), '_self');
      showListToast(result.contactNumber
        ? `Emergency call to ${result.contactName || 'emergency contact'} (${result.contactNumber}) for ${patientName(patient)} — ${result.callStatus}`
        : `Call recorded for ${patientName(patient)} — no emergency contact on file.`);
    } catch (e) {
      showListToast('Could not place call: ' + e.message, true);
    } finally {
      setTimeout(() => { btn.disabled = false; btn.innerHTML = originalHtml; }, 1500);
    }
  }
  window.quickEmergencyCall = quickEmergencyCall;

  // Real-time, data-isolated: only patients the Admin assigned to THIS account.
  document.addEventListener('vm:auth-ready', () => {
    VmAuth.listenAssignedPatients(session.id, persons => render(persons));
  });
</script>
</body>
</html>
