<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zones – VisionMate Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../css/theme.css" rel="stylesheet" />
</head>
<body>
<div id="sidebarMount"></div>
<div class="main-wrapper">
  <div id="topbarMount"></div>
  <main class="content-area">

    <!-- Zone Cards -->
    <div class="row g-4" id="zoneCards"></div>

    <!-- Zone detail -->
    <div class="section-card mt-4" id="zoneDetail" style="display:none">
      <div class="card-header d-flex justify-content-between align-items-center" id="zoneDetailHeader">
        <span></span>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearZoneFilter()">← All Zones</button>
      </div>
      <div class="card-body">
        <div class="row g-3" id="zoneCaretakerCards"></div>
      </div>
    </div>

    <!-- All Caretakers Table (default view) -->
    <div class="section-card mt-4" id="allCaretakersSection">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span><i class="bi bi-shield-fill-check"></i> All Caretakers by Zone</span>
        <input type="search" id="zoneSearch" class="form-control form-control-sm" placeholder="Search caretaker…" style="width:220px" />
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th>Name</th><th>Zone</th><th>Gender</th><th>Age</th><th>Contact</th><th>Experience</th><th>Status</th></tr>
            </thead>
            <tbody id="allCaretakersTable"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/admin-firestore.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script>
  vmRequireAdmin();
  document.getElementById('sidebarMount').innerHTML = PortalLayout.getSidebarHTML('Zones');
  document.getElementById('topbarMount').innerHTML  = PortalLayout.getTopbarHTML('Zone Management', 'View and manage all Karachi zones');

  const { zones, caretakers, blindUsers } = VM_DATA;

  // Check URL param
  const urlZone = new URLSearchParams(location.search).get('zone');

  // Zone cards
  const zoneCardsEl = document.getElementById('zoneCards');
  zones.forEach(z => {
    const ct = caretakers.filter(c => c.zoneId === z.id);
    const bu = blindUsers.filter(u => u.zoneId === z.id);
    const hwTag = z.id === 'z4' ? `<span class="badge bg-warning text-dark ms-2"><i class="bi bi-cpu-fill me-1"></i>HW Zone</span>` : '';
    zoneCardsEl.innerHTML += `
    <div class="col-md-3">
      <div class="user-card" onclick="filterByZone('${z.id}')" style="cursor:pointer;border-left:4px solid ${z.color}">
        <div class="d-flex align-items-center gap-2 mb-3">
          <div style="width:44px;height:44px;border-radius:.6rem;background:${z.color}20;color:${z.color};display:flex;align-items:center;justify-content:center;font-size:1.3rem">
            <i class="bi bi-geo-alt-fill"></i>
          </div>
          <div>
            <div class="fw-bold">${z.name} ${hwTag}</div>
            <div class="text-muted small">Karachi, Pakistan</div>
          </div>
        </div>
        <div class="d-flex justify-content-around text-center">
          <div><div class="fw-bold fs-5" style="color:${z.color}">${ct.length}</div><div class="text-muted small">Caretakers</div></div>
          <div><div class="fw-bold fs-5" style="color:${z.color}">${bu.length}</div><div class="text-muted small">Patients</div></div>
          <div><div class="fw-bold fs-5" style="color:${z.color}">${ct.filter(c=>c.status==='Active').length}</div><div class="text-muted small">Active</div></div>
        </div>
        <div class="mt-3 text-center">
          <span class="badge" style="background:${z.color}20;color:${z.color}">View Caretakers</span>
        </div>
      </div>
    </div>`;
  });

  // All caretakers table
  function renderTable(list) {
    const tbody = document.getElementById('allCaretakersTable');
    tbody.innerHTML = list.map(c => {
      const hw = c.hardwareLinked ? hwBadge() : '';
      return `<tr onclick="location.href='caretakers.html?ct=${c.id}'" style="cursor:pointer">
        <td><strong>${c.name}</strong>${hw}</td>
        <td><span class="badge" style="background:${zones.find(z=>z.id===c.zoneId)?.color||'#888'}30;color:${zones.find(z=>z.id===c.zoneId)?.color||'#888'}">${c.zoneName}</span></td>
        <td>${c.gender}</td><td>${c.age}</td><td>${c.contact}</td><td>${c.experience}</td>
        <td>${statusBadge(c.status)}</td>
      </tr>`;
    }).join('');
  }
  renderTable(caretakers);

  // Search
  document.getElementById('zoneSearch').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    renderTable(caretakers.filter(c => c.name.toLowerCase().includes(q) || c.zoneName.toLowerCase().includes(q)));
  });

  function filterByZone(zoneId) {
    history.replaceState({}, '', '?zone=' + zoneId);
    const z  = zones.find(z => z.id === zoneId);
    const ct = caretakers.filter(c => c.zoneId === zoneId);
    document.getElementById('allCaretakersSection').style.display = 'none';
    const detail = document.getElementById('zoneDetail');
    detail.style.display = 'block';
    document.getElementById('zoneDetailHeader').querySelector('span').innerHTML =
      `<i class="bi bi-geo-alt-fill me-2" style="color:${z.color}"></i>${z.name} — Caretakers`;
    const cards = document.getElementById('zoneCaretakerCards');
    cards.innerHTML = ct.map(c => {
      const bu = blindUsers.filter(u => u.caretakerId === c.id);
      const hw = c.hardwareLinked ? `<span class="badge bg-warning text-dark ms-1"><i class="bi bi-cpu-fill me-1"></i>HW</span>` : '';
      return `
      <div class="col-md-4 col-lg-3">
        <a href="caretakers.html?ct=${c.id}" class="user-card d-block text-decoration-none" style="border-top:3px solid ${z.color}">
          <div class="d-flex align-items-center gap-2 mb-2">
            <div class="user-pill-avatar" style="background:var(--gradient-btn)">${getInitial(c.name)}</div>
            <div><div class="fw-semibold small">${c.name}${hw}</div><div class="text-muted" style="font-size:.72rem">${c.gender}, ${c.age} yrs</div></div>
          </div>
          <div class="d-flex justify-content-between small text-muted">
            <span><i class="bi bi-person-fill me-1"></i>${bu.length} user${bu.length!==1?'s':''}</span>
            ${statusBadge(c.status)}
          </div>
        </a>
      </div>`;
    }).join('');
  }

  function clearZoneFilter() {
    history.replaceState({}, '', 'zones.html');
    document.getElementById('zoneDetail').style.display = 'none';
    document.getElementById('allCaretakersSection').style.display = 'block';
  }

  if (urlZone) filterByZone(urlZone);
</script>
</body>
</html>
